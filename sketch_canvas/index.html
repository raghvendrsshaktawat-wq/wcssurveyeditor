<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WCS Sketch Pad</title>
<style>
  :root {
    --bd: #d6dee8;
    --ink: #0f172a;
    --muted: #64748b;
    --primary: #0B3D91;
    --accent: #1266C1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: transparent;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { padding: 2px; }

  /* ---------- toolbar ---------- */
  #bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    padding: 6px 7px; margin-bottom: 7px;
    border: 1px solid var(--bd); border-radius: 8px; background: #f8fafc;
  }
  .sep { width: 1px; height: 20px; background: var(--bd); margin: 0 3px; }
  button {
    font: inherit; font-size: 12.5px; line-height: 1;
    padding: 6px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--bd); background: #fff; color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  button.ghost { color: var(--muted); }
  .sw {
    width: 22px; height: 22px; padding: 0; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px var(--bd);
  }
  .sw.on { box-shadow: 0 0 0 2px var(--primary); }
  .wbtn { width: 30px; padding: 6px 0; display: flex; align-items: center; justify-content: center; }
  .wdot { display: block; border-radius: 50%; background: var(--ink); }
  .wbtn.on .wdot { background: #fff; }
  .spacer { flex: 1 1 auto; }

  /* ---------- canvas ---------- */
  #stage { position: relative; width: 100%; }
  canvas {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--bd); border-radius: 8px; background: #fff;
    touch-action: none; cursor: crosshair;
  }
  #tin {
    position: absolute; display: none; z-index: 5;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2px 4px; border: 1px dashed var(--accent); border-radius: 3px;
    background: rgba(255,255,255,0.97); outline: none; min-width: 60px;
    color: #111;
  }
  #hint {
    margin-top: 5px; font-size: 11.5px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px;
  }
  #hint b { color: var(--ink); font-weight: 600; }

  /* ---------- mobile: finger-size toolbar + taller canvas ---------- */
  @media (max-width: 768px) {
    #wrap { padding: 0; }
    #bar { gap: 8px; padding: 8px; }
    button { font-size: 16px; padding: 11px 14px; }   /* >=44px tap target */
    .wbtn { width: 44px; padding: 11px 0; }
    .sw { width: 34px; height: 34px; }
    .sep { height: 28px; }
    /* Canvas keeps its natural aspect (width:100%); the full-screen dialog
       makes 100% much larger on a phone. No min-height — that would distort
       the on-screen drawing vs. the exported PNG. */
    #hint { font-size: 13px; }
  }
</style>
</head>

<body>
<div id="wrap">
  <div id="bar">
    <button id="t-pen"   class="tool on" data-tool="pen"    title="Freehand draw">✏️ Draw</button>
    <button id="t-line"  class="tool"    data-tool="line"   title="Straight line">📏 Line</button>
    <button id="t-text"  class="tool"    data-tool="text"   title="Click canvas, type, press Enter">🔤 Text</button>
    <button id="t-erase" class="tool"    data-tool="erase"  title="Click an item to delete it">🩹 Erase</button>

    <span class="sep"></span>
    <button class="sw col on" data-color="#111111" style="background:#111111" title="Black"></button>
    <button class="sw col"    data-color="#E8212E" style="background:#E8212E" title="Red"></button>
    <button class="sw col"    data-color="#005BAC" style="background:#005BAC" title="Blue"></button>

    <span class="sep"></span>
    <button class="wbtn wsz on" data-w="3"  title="Thin"><i class="wdot" style="width:4px;height:4px"></i></button>
    <button class="wbtn wsz"    data-w="6"  title="Medium"><i class="wdot" style="width:7px;height:7px"></i></button>
    <button class="wbtn wsz"    data-w="10" title="Thick"><i class="wdot" style="width:11px;height:11px"></i></button>

    <span class="sep"></span>
    <button id="b-undo" class="ghost" title="Undo last item (Ctrl+Z)">↶ Undo</button>
    <button id="b-clear" class="ghost" title="Remove everything">🗑 Clear</button>
    <button id="b-grid" class="on" title="Grid is a drawing aid only — never exported">▦ Grid</button>

    <span class="spacer"></span>
    <button id="b-cancel" class="ghost">Cancel</button>
    <button id="b-save" class="primary" title="Save sketch (Ctrl+S)">💾 Save sketch</button>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <input id="tin" type="text" autocomplete="off" spellcheck="false" />
  </div>

  <div id="hint">
    <span id="hint-left">Draw freehand, add text boxes, then hit <b>Save sketch</b>.</span>
    <span id="hint-right"></span>
  </div>
</div>

<script>
/* =========================================================================
   WCS Sketch Pad — vanilla bidirectional Streamlit component.
   No npm build, no external CDN, no extra pip package. Talks to Streamlit
   with the documented postMessage protocol only.

   Design notes (why it does NOT flicker):
     • Every interaction (tool switch, colour, draw, text) is handled 100%
       inside this iframe. Streamlit is only contacted ONCE — on Save/Cancel.
     • Drawing is an item MODEL (list of strokes/texts) that is re-rendered,
       so Undo/Erase are exact and never leave ghosts.
     • Text is a real <input> floated over the canvas, so typing is native.

   ── EXPORT PIPELINE (revised 05-Aug-2026) ────────────────────────────────
   The sketch is stamped INLINE on the item page, into the blank column
   beside the "Production Size" row — roughly a 120-150 pt wide box. It is
   never printed at A4 size. So the old 2340x1500 / ~70 KB export was about
   3x more resolution than crisp print needs, and every wasted pixel costs
   RAM on a shared 1 GB Streamlit container.

   Three changes, in order of how much they matter:

     1. CROP TO CONTENT. The export is cropped to the bounding box of what
        was actually drawn, plus a small margin. The real win is NOT bytes
        (3-32%, measured) — it is that the drawing FILLS the small box on
        the page instead of floating in a sea of white. A sketch made in
        one corner of the pad used to shrink to a third of the box; now it
        fills it.

     2. NO GRID IN THE EXPORT. Only worth ~10% of the bytes, but a 20 px
        grid squeezed into a 130 pt box turns into moire noise. It stays on
        screen as a drawing aid.

     3. 1x EXPORT SCALE, with adaptive downscale as a safety net. Display
        stays at DISPLAY_SCALE for crispness on hi-dpi screens; the export
        renders separately offscreen. Typical sketch now lands ~15 KB at
        ~230 DPI in the box. If a very heavy sketch exceeds SIZE_BUDGET_KB
        we step down the ladder, but never below MIN_EXPORT_SCALE — losing
        legibility is worse than a slightly bigger file.
   ======================================================================== */
(function () {
  "use strict";

  // ---- logical drawing space -------------------------------------------
  var W = 780, H = 500;
  var DISPLAY_SCALE = 2;      // backing store multiplier — on-screen crispness
  var GRID = 20;

  // ---- export tuning ----------------------------------------------------
  var EXPORT_SCALE = 1.0;         // 1 logical px -> 1 exported px
  var EXPORT_PAD = 14;            // logical px of white margin around content
  var SIZE_BUDGET_KB = 20;        // soft target; see MIN_EXPORT_SCALE
  var SCALE_LADDER = [1.0, 0.85, 0.72, 0.6];
  var MIN_EXPORT_SCALE = 0.6;     // never degrade past this, budget or not

  var cv   = document.getElementById("cv");
  var ctx  = cv.getContext("2d");
  var tin  = document.getElementById("tin");
  var hintR = document.getElementById("hint-right");

  cv.width  = W * DISPLAY_SCALE;
  cv.height = H * DISPLAY_SCALE;

  // ---- state ------------------------------------------------------------
  var items = [];
  var tool = "pen";
  var color = "#111111";
  var lw = 3;
  var grid = true;
  var drawing = false;
  var cur = null;
  var loaded = false;
  var TEXT_SIZE = { 3: 20, 6: 28, 10: 38 };

  // ---- shared drawing routine (used by screen AND export) ---------------
  function drawItem(c, it) {
    if (it.k === "path") {
      if (!it.pts || it.pts.length === 0) return;
      c.strokeStyle = it.color;
      c.lineWidth = it.w;
      c.beginPath();
      c.moveTo(it.pts[0][0], it.pts[0][1]);
      if (it.pts.length === 1) { c.lineTo(it.pts[0][0] + 0.1, it.pts[0][1]); }
      for (var i = 1; i < it.pts.length; i++) c.lineTo(it.pts[i][0], it.pts[i][1]);
      c.stroke();
    } else if (it.k === "text") {
      c.fillStyle = it.color;
      c.font = it.s + "px 'Segoe UI', Arial, sans-serif";
      c.fillText(it.t, it.x, it.y);
    }
  }

  function reset() {
    ctx.setTransform(DISPLAY_SCALE, 0, 0, DISPLAY_SCALE, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.textBaseline = "alphabetic";
  }

  function paintGrid() {
    ctx.save();
    ctx.strokeStyle = "#e6edf5";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = GRID; x < W; x += GRID) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (var y = GRID; y < H; y += GRID) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
    ctx.restore();
  }

  function paint() {
    reset();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    if (grid) paintGrid();
    for (var i = 0; i < items.length; i++) drawItem(ctx, items[i]);
    hintR.textContent = items.length ? items.length + " item(s)" : "";
  }

  // ---- geometry helpers -------------------------------------------------
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    return [
      (ev.clientX - r.left) * (W / r.width),
      (ev.clientY - r.top) * (H / r.height)
    ];
  }

  function distToSeg(p, a, b) {
    var vx = b[0] - a[0], vy = b[1] - a[1];
    var wx = p[0] - a[0], wy = p[1] - a[1];
    var L = vx * vx + vy * vy;
    var t = L ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / L)) : 0;
    var dx = a[0] + t * vx - p[0], dy = a[1] + t * vy - p[1];
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* Bounding box of ONE item, in logical units. Shared by hit-testing and
     by the export crop, so the two can never disagree. */
  function itemBounds(c, it) {
    if (it.k === "path") {
      var pad = it.w / 2 + 1;
      var b = [1e9, 1e9, -1e9, -1e9];
      for (var i = 0; i < it.pts.length; i++) {
        var p = it.pts[i];
        b[0] = Math.min(b[0], p[0] - pad); b[1] = Math.min(b[1], p[1] - pad);
        b[2] = Math.max(b[2], p[0] + pad); b[3] = Math.max(b[3], p[1] + pad);
      }
      return b;
    }
    c.font = it.s + "px 'Segoe UI', Arial, sans-serif";
    var w = c.measureText(it.t).width;
    return [it.x - 2, it.y - it.s - 2, it.x + w + 2, it.y + it.s * 0.3 + 2];
  }

  function contentBounds(pad) {
    if (!items.length) return [0, 0, W, H];
    reset();
    var b = [1e9, 1e9, -1e9, -1e9];
    for (var i = 0; i < items.length; i++) {
      var ib = itemBounds(ctx, items[i]);
      b[0] = Math.min(b[0], ib[0]); b[1] = Math.min(b[1], ib[1]);
      b[2] = Math.max(b[2], ib[2]); b[3] = Math.max(b[3], ib[3]);
    }
    return [
      Math.max(0, b[0] - pad), Math.max(0, b[1] - pad),
      Math.min(W, b[2] + pad), Math.min(H, b[3] + pad)
    ];
  }

  function hitIndex(p) {
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      if (it.k === "path") {
        var tol = Math.max(8, it.w * 2);
        if (it.pts.length === 1 && distToSeg(p, it.pts[0], it.pts[0]) <= tol) return i;
        for (var j = 1; j < it.pts.length; j++) {
          if (distToSeg(p, it.pts[j - 1], it.pts[j]) <= tol) return i;
        }
      } else {
        reset();
        var b = itemBounds(ctx, it);
        if (p[0] >= b[0] && p[0] <= b[2] && p[1] >= b[1] && p[1] <= b[3]) return i;
      }
    }
    return -1;
  }

  // ---- pointer handling -------------------------------------------------
  cv.addEventListener("pointerdown", function (ev) {
    if (tin.style.display === "block") commitText();

    var p = pos(ev);

    if (tool === "erase") {
      var k = hitIndex(p);
      if (k >= 0) { items.splice(k, 1); paint(); }
      return;
    }
    if (tool === "text") { openText(p); return; }

    drawing = true;
    cv.setPointerCapture(ev.pointerId);
    cur = { k: "path", pts: [p], color: color, w: lw, straight: (tool === "line") };
    items.push(cur);
  });

  cv.addEventListener("pointermove", function (ev) {
    if (!drawing || !cur) return;
    var p = pos(ev);

    if (cur.straight) { cur.pts = [cur.pts[0], p]; paint(); return; }

    var prev = cur.pts[cur.pts.length - 1];
    if (Math.abs(p[0] - prev[0]) < 1 && Math.abs(p[1] - prev[1]) < 1) return;
    cur.pts.push(p);

    reset();                                   // incremental — no full repaint
    ctx.strokeStyle = cur.color;
    ctx.lineWidth = cur.w;
    ctx.beginPath();
    ctx.moveTo(prev[0], prev[1]);
    ctx.lineTo(p[0], p[1]);
    ctx.stroke();
  });

  function endStroke(ev) {
    if (!drawing) return;
    drawing = false;
    try { cv.releasePointerCapture(ev.pointerId); } catch (e) {}
    if (cur && cur.pts.length === 1 && cur.straight) items.pop();
    cur = null;
    paint();
  }
  cv.addEventListener("pointerup", endStroke);
  cv.addEventListener("pointercancel", endStroke);
  cv.addEventListener("pointerleave", function (ev) { if (drawing) endStroke(ev); });

  // ---- text tool --------------------------------------------------------
  var tPos = null;
  function openText(p) {
    tPos = p;
    var r = cv.getBoundingClientRect();
    var sx = r.width / W;
    var size = TEXT_SIZE[lw] || 28;
    tin.value = "";
    tin.style.display = "block";
    tin.style.left = (p[0] * sx) + "px";
    tin.style.top = (p[1] * sx - size * sx) + "px";
    tin.style.fontSize = (size * sx) + "px";
    tin.style.color = color;
    tin.style.width = Math.max(80, Math.min(400, (W - p[0]) * sx)) + "px";
    setTimeout(function () { tin.focus(); }, 0);
  }

  function commitText() {
    var v = (tin.value || "").trim();
    tin.style.display = "none";
    tin.value = "";
    if (!v || !tPos) { tPos = null; return; }
    items.push({ k: "text", x: tPos[0], y: tPos[1], s: (TEXT_SIZE[lw] || 28), color: color, t: v });
    tPos = null;
    paint();
  }

  tin.addEventListener("keydown", function (ev) {
    ev.stopPropagation();
    if (ev.key === "Enter") { ev.preventDefault(); commitText(); }
    else if (ev.key === "Escape") { ev.preventDefault(); tin.style.display = "none"; tin.value = ""; tPos = null; }
  });
  tin.addEventListener("blur", function () { if (tin.style.display === "block") commitText(); });

  // ---- toolbar wiring ---------------------------------------------------
  function group(sel, fn) {
    var els = document.querySelectorAll(sel);
    Array.prototype.forEach.call(els, function (el) {
      el.addEventListener("click", function () {
        Array.prototype.forEach.call(els, function (o) { o.classList.remove("on"); });
        el.classList.add("on");
        fn(el);
      });
    });
  }
  group(".tool", function (el) {
    tool = el.getAttribute("data-tool");
    cv.style.cursor = (tool === "text") ? "text" : (tool === "erase" ? "not-allowed" : "crosshair");
  });
  group(".col", function (el) { color = el.getAttribute("data-color"); });
  group(".wsz", function (el) { lw = parseInt(el.getAttribute("data-w"), 10); });

  document.getElementById("b-undo").addEventListener("click", function () {
    if (items.length) { items.pop(); paint(); }
  });
  document.getElementById("b-clear").addEventListener("click", function () {
    if (items.length) { items = []; paint(); }
  });
  document.getElementById("b-grid").addEventListener("click", function () {
    grid = !grid;
    this.classList.toggle("on", grid);
    paint();
  });

  // ---- EXPORT -----------------------------------------------------------
  /* Render the items to an offscreen canvas, cropped to content, at the
     given scale. Never includes the grid. Returns a PNG data-URL. */
  function renderExport(scale) {
    var b = contentBounds(EXPORT_PAD);
    var bw = Math.max(1, b[2] - b[0]), bh = Math.max(1, b[3] - b[1]);

    var out = document.createElement("canvas");
    out.width = Math.max(1, Math.round(bw * scale));
    out.height = Math.max(1, Math.round(bh * scale));

    var c = out.getContext("2d");
    c.setTransform(scale, 0, 0, scale, -b[0] * scale, -b[1] * scale);
    c.lineCap = "round";
    c.lineJoin = "round";
    c.textBaseline = "alphabetic";
    c.fillStyle = "#ffffff";
    c.fillRect(b[0], b[1], bw, bh);
    for (var i = 0; i < items.length; i++) drawItem(c, items[i]);

    return { url: out.toDataURL("image/png"), w: out.width, h: out.height };
  }

  function dataUrlBytes(url) {
    var i = url.indexOf(",");
    var b64 = i >= 0 ? url.slice(i + 1) : url;
    var padding = (b64.slice(-2) === "==") ? 2 : (b64.slice(-1) === "=" ? 1 : 0);
    return Math.floor(b64.length * 3 / 4) - padding;
  }

  /* Walk the scale ladder until the PNG fits the byte budget. Stops at
     MIN_EXPORT_SCALE regardless — an unreadable sketch is worse than a
     slightly oversized file. */
  function exportPNG() {
    var best = null;
    for (var i = 0; i < SCALE_LADDER.length; i++) {
      var s = SCALE_LADDER[i];
      if (s < MIN_EXPORT_SCALE) break;
      var r = renderExport(s);
      best = { url: r.url, w: r.w, h: r.h, scale: s, bytes: dataUrlBytes(r.url) };
      if (best.bytes <= SIZE_BUDGET_KB * 1024) break;
    }
    return best;
  }

  // ---- Streamlit protocol ----------------------------------------------
  function post(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in data) if (Object.prototype.hasOwnProperty.call(data, k)) msg[k] = data[k];
    window.parent.postMessage(msg, "*");
  }
  function setFrameHeight() {
    post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 10 });
  }
  function setValue(v) {
    post("streamlit:setComponentValue", { value: v, dataType: "json" });
  }

  function save() {
    if (tin.style.display === "block") commitText();
    paint();
    if (!items.length) {
      setValue({ action: "save", png: "", items: [], count: 0, seq: Date.now() });
      return;
    }
    var e = exportPNG();
    hintR.textContent = items.length + " item(s) · " + (e.bytes / 1024).toFixed(1) + " KB";
    setValue({
      action: "save", png: e.url, items: items, count: items.length,
      bytes: e.bytes, px_w: e.w, px_h: e.h, scale: e.scale, seq: Date.now()
    });
  }
  function cancel() { setValue({ action: "cancel", seq: Date.now() }); }

  document.getElementById("b-save").addEventListener("click", save);
  document.getElementById("b-cancel").addEventListener("click", cancel);

  document.addEventListener("keydown", function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "s") { ev.preventDefault(); save(); }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") {
      ev.preventDefault();
      if (items.length) { items.pop(); paint(); }
    }
  });

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || d.type !== "streamlit:render") return;
    var args = d.args || {};
    if (!loaded) {                      // hydrate ONCE — reruns must not wipe work
      loaded = true;
      if (Array.isArray(args.initial_items) && args.initial_items.length) {
        items = args.initial_items;
        paint();
      }
      if (typeof args.grid === "boolean") {
        grid = args.grid;
        document.getElementById("b-grid").classList.toggle("on", grid);
        paint();
      }
    }
    setFrameHeight();
  });

  window.addEventListener("resize", function () {
    setFrameHeight();
    if (tin.style.display === "block") { tin.style.display = "none"; tPos = null; }
  });

  // ---- boot -------------------------------------------------------------
  paint();
  post("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight();
  setTimeout(setFrameHeight, 120);
})();
</script>
</body>
</html>
